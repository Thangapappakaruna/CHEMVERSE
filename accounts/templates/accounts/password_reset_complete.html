{% extends 'base.html' %}
{% block title %}Password updated{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="glass auth-card">
    <div class="auth-ic">{% icon 'check' 30 %}</div>
    <h1 class="h3 text-center mb-1">Password updated</h1>
    <p class="text-secondary text-center mb-4">You can now sign in with your new password.</p>

    <a class="btn btn-cv w-100" href="{% url 'accounts:login' %}">Sign in</a>
  </div>
</div>
{% endblock %}
