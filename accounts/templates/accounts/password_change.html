{% extends 'base.html' %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="glass auth-card">
    <div class="auth-ic">{% icon 'lock' 30 %}</div>
    <h1 class="h3 text-center mb-1">Change password</h1>
    <p class="text-secondary text-center mb-4">Enter your current password, then the new one twice.</p>

    <form method="post" novalidate>{% csrf_token %}
      {% for field in form %}{% include 'includes/field.html' %}{% endfor %}
      <button class="btn btn-cv w-100 py-2">Change password</button>
    </form>
  </div>
</div>
{% endblock %}
