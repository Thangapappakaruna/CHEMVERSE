{% extends 'base.html' %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="glass auth-card">
    <div class="auth-ic">{% icon 'mail' 30 %}</div>
    <h1 class="h3 text-center mb-1">Forgot your password?</h1>
    <p class="text-secondary text-center mb-4">Enter your account email and we will send a reset link.</p>

    <form method="post" novalidate>{% csrf_token %}
      <div class="mb-3"><label class="form-label" for="id_email">Email address</label>
        <input type="email" name="email" id="id_email" class="form-control" required autofocus value="{{ form.email.value|default:'' }}">
        {% for e in form.email.errors %}<div class="invalid-feedback d-block">{{ e }}</div>{% endfor %}</div>
      <button class="btn btn-cv w-100 py-2">Send reset link</button>
    </form>
    <p class="text-center small mt-3 mb-0"><a href="{% url 'accounts:login' %}">Back to sign in</a></p>
  </div>
</div>
{% endblock %}
