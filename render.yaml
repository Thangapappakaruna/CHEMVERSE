# Render Blueprint: one web service + one free PostgreSQL database.
databases:
  - name: chemverse-db
    plan: free
    databaseName: chemverse
    user: chemverse

services:
  - type: web
    name: chemverse
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: chemverse-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: WEB_CONCURRENCY
        value: "2"
